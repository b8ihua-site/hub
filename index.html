<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✦ PORTAL ✦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

:root {
–bg: #0a0a0f;
–surface: #12121a;
–card: #1a1a28;
–card-hover: #22223a;
–accent1: #ff3d7f;
–accent2: #b44fff;
–accent3: #ff8c42;
–gold: #e8c97e;
–text: #e8e8f0;
–muted: #7070a0;
–glow1: rgba(255, 61, 127, 0.4);
–glow2: rgba(180, 79, 255, 0.4);
}

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
width: 100%; min-height: 100vh;
background: var(–bg);
font-family: ‘Zen Kaku Gothic New’, sans-serif;
color: var(–text);
overflow-x: hidden;
}

/* — Background atmosphere — */
body::before {
content: ‘’;
position: fixed; inset: 0; z-index: 0;
background:
radial-gradient(ellipse 60% 40% at 20% 20%, rgba(255,61,127,0.08) 0%, transparent 70%),
radial-gradient(ellipse 50% 50% at 80% 80%, rgba(180,79,255,0.08) 0%, transparent 70%),
radial-gradient(ellipse 40% 30% at 60% 10%, rgba(255,140,66,0.05) 0%, transparent 60%);
pointer-events: none;
}

/* Animated grid */
body::after {
content: ‘’;
position: fixed; inset: 0; z-index: 0;
background-image:
linear-gradient(rgba(255,61,127,0.04) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,61,127,0.04) 1px, transparent 1px);
background-size: 60px 60px;
animation: gridMove 20s linear infinite;
pointer-events: none;
}
@keyframes gridMove {
0% { transform: translateY(0); }
100% { transform: translateY(60px); }
}

.wrapper {
position: relative; z-index: 1;
max-width: 900px;
margin: 0 auto;
padding: 40px 20px 60px;
}

/* — Header — */
header {
text-align: center;
margin-bottom: 50px;
animation: fadeDown 0.8s ease both;
}
@keyframes fadeDown {
from { opacity: 0; transform: translateY(-20px); }
to   { opacity: 1; transform: translateY(0); }
}

.logo {
font-family: ‘Playfair Display’, serif;
font-size: clamp(2.2rem, 6vw, 3.5rem);
font-weight: 700;
letter-spacing: 0.15em;
background: linear-gradient(135deg, var(–accent1) 0%, var(–accent2) 50%, var(–gold) 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
background-clip: text;
filter: drop-shadow(0 0 30px rgba(255,61,127,0.5));
line-height: 1.1;
}

.tagline {
margin-top: 10px;
font-size: 0.78rem;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(–muted);
}

.divider {
width: 120px; height: 1px;
background: linear-gradient(90deg, transparent, var(–accent1), var(–accent2), transparent);
margin: 16px auto 0;
}

/* — Clock — */
.clock {
font-size: 0.85rem;
color: var(–muted);
margin-top: 14px;
letter-spacing: 0.1em;
font-weight: 300;
}
.clock span { color: var(–gold); }

/* — Section label — */
.section-label {
font-size: 0.65rem;
letter-spacing: 0.4em;
text-transform: uppercase;
color: var(–muted);
margin-bottom: 18px;
padding-left: 4px;
display: flex; align-items: center; gap: 10px;
}
.section-label::after {
content: ‘’;
flex: 1; height: 1px;
background: linear-gradient(90deg, var(–muted), transparent);
opacity: 0.3;
}

/* — Grid — */
.grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
margin-bottom: 40px;
}

@media (min-width: 600px) {
.grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
}
@media (min-width: 800px) {
.grid { grid-template-columns: repeat(4, 1fr); }
}

/* — Card — */
.card {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 22px 12px 18px;
background: var(–card);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
text-decoration: none;
color: var(–text);
position: relative;
overflow: hidden;
cursor: pointer;
transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
animation: fadeUp 0.6s ease both;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.10s; }
.card:nth-child(3) { animation-delay: 0.15s; }
.card:nth-child(4) { animation-delay: 0.20s; }
.card:nth-child(5) { animation-delay: 0.25s; }
.card:nth-child(6) { animation-delay: 0.30s; }
.card:nth-child(7) { animation-delay: 0.35s; }
.card:nth-child(8) { animation-delay: 0.40s; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(24px); }
to   { opacity: 1; transform: translateY(0); }
}

/* shimmer line at top */
.card::before {
content: ‘’;
position: absolute; top: 0; left: 0; right: 0; height: 2px;
background: linear-gradient(90deg, transparent, var(–card-accent, var(–accent1)), transparent);
opacity: 0;
transition: opacity 0.3s;
}

/* glow blob */
.card::after {
content: ‘’;
position: absolute;
width: 80px; height: 80px;
border-radius: 50%;
background: var(–card-accent, var(–accent1));
opacity: 0;
filter: blur(40px);
transition: opacity 0.4s;
pointer-events: none;
}

.card:hover, .card:active {
background: var(–card-hover);
transform: translateY(-4px) scale(1.02);
box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
}
.card:hover::before, .card:active::before { opacity: 1; }
.card:hover::after, .card:active::after { opacity: 0.15; }
.card:active { transform: translateY(-1px) scale(0.99); }

.card-icon {
font-size: 2.0rem;
margin-bottom: 10px;
filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
line-height: 1;
}

.card-name {
font-size: 0.88rem;
font-weight: 700;
letter-spacing: 0.04em;
text-align: center;
line-height: 1.2;
}

.card-desc {
font-size: 0.65rem;
color: var(–muted);
margin-top: 5px;
text-align: center;
letter-spacing: 0.02em;
}

/* Badge */
.badge {
position: absolute; top: 8px; right: 8px;
font-size: 0.55rem;
font-weight: 900;
letter-spacing: 0.08em;
text-transform: uppercase;
padding: 2px 6px;
border-radius: 4px;
background: var(–card-accent, var(–accent1));
color: #fff;
opacity: 0.9;
}

/* Color variants */
.c-pink  { –card-accent: var(–accent1); }
.c-purple { –card-accent: var(–accent2); }
.c-orange { –card-accent: var(–accent3); }
.c-gold  { –card-accent: var(–gold); }

/* — Footer — */
footer {
text-align: center;
font-size: 0.65rem;
color: var(–muted);
letter-spacing: 0.15em;
opacity: 0.5;
margin-top: 20px;
}

/* — Pulse dot — */
.live-dot {
display: inline-block;
width: 7px; height: 7px;
border-radius: 50%;
background: #ff3d7f;
margin-right: 6px;
animation: pulse 1.5s ease-in-out infinite;
vertical-align: middle;
}
@keyframes pulse {
0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(255,61,127,0.5); }
50%       { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 0 5px rgba(255,61,127,0); }
}
</style>

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const days = ['日','月','火','水','木','金','土'];
    const day = days[now.getDay()];
    document.getElementById('clock').innerHTML =
      `<span>${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}</span> (${day}) <span>${h}:${m}</span>`;
  }
  updateClock();
  setInterval(updateClock, 10000);
</script>
